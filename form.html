<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 🌐 Basic Metadata -->
    <!-- Defines document type, language, character encoding, and scaling for mobile devices -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🧁 Page Title -->
    <!-- Title shown in the browser tab -->
    <title>Vanilla 🍰 | Course Registration</title>

    <!-- 🎨 External CSS stylesheets -->
    <!-- styleBase.css = global design rules -->
    <!-- styleForm.css = specific design rules for the registration form page -->
    <link rel="stylesheet" href="css/styleBase.css">
    <link rel="stylesheet" href="css/styleForm.css"> 
</head>

<body>
    <!-- 🍓 HEADER SECTION -->
    <!-- Contains the website logo and navigation menu -->
    <header>
        <!-- Website logo -->
        <img src="media/images/VANILLA.png" alt="Vanilla Logo" class="logo">

        <!-- Navigation links -->
        <nav>
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="contact.html">Contact</a>
            <a href="courses.html" class="active">Courses</a> <!-- Highlights current page -->
        </nav>
    </header>

    <!-- 📝 FORM SECTION -->
    <!-- Main content area with the course registration form -->
    <section class="hero-style-form">
        <div class="form-text-box">
            
            <!-- Page title -->
            <h1 class="page-title">Course Registration 🧁</h1>
            
            <!-- Short introduction -->
            <p class="page-intro">
                Fill out the form below to register for your chosen baking course!
            </p>

            <!-- Registration form -->
            <form action="#" method="POST" class="registration-form">
                
                <!-- Full Name field -->
                <div class="form-group">
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full_name" required>
                </div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <!-- Course selection dropdown -->
                <div class="form-group">
                    <label for="course-select">Select Course:</label>
                    <select id="course-select" name="course_select" required>
                        <option value="" disabled selected>-- Choose a Course --</option>
                        <option value="cupcakes">Chocolate Course</option>
                        <option value="gelato">Cake Design</option>
                        <option value="donuts">Cookies Course</option>
                        <option value="cheesecake">French Pastry</option>
                    </select>
                </div>
                
                <!-- Notes field (optional) -->
                <div class="form-group">
                    <label for="message">Notes (Optional):</label>
                    <textarea id="message" name="message" rows="3"></textarea>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn">Register Now</button>
            </form>
            
        </div>
    </section>

    <!-- 🧁 FOOTER SECTION -->
    <!-- Displays site ownership and credit line -->
    <footer>
        <p>© 2025 Vanilla Blog | Made with ❤️ by Shira & Naomi</p>
    </footer>
</body>
</html>
